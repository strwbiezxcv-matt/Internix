<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Internix — find internship and OJT opportunities matched to your academic program and preferred location across Bulacan and Metro Manila." />
  <title>Internix — Student Internship &amp; OJT Opportunity Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232e9e5b'/%3E%3Cpath d='M16 7l9 5-9 5-9-5 9-5zm-6 9v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4l-6 3.3L10 16z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ============================== HEADER ============================== -->
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="logo" href="#/" data-nav="home" aria-label="Internix home">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="18" height="18" focusable="false"><path d="M16 7l9 5-9 5-9-5 9-5zm-6 9v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4l-6 3.3L10 16z" fill="currentColor"/></svg>
        </span>
        <span class="logo-text">Internix</span>
      </a>
      <nav class="topnav main-nav" id="mainNav" aria-label="Main navigation"></nav>
      <div class="spacer"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">☰</button>
    </div>
  </header>

  <!-- ============================== MAIN ============================== -->
  <main id="app"></main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="mark sm" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="14" height="14" focusable="false"><path d="M16 7l9 5-9 5-9-5 9-5zm-6 9v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4l-6 3.3L10 16z" fill="currentColor"/></svg>
        </span>
        <strong>Internix</strong>
      </div>
      <p class="footer-note">Internship discovery &amp; company directory for students — matched by program and location across Bulacan and Metro Manila.</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="#/companies">Companies</a>
        <a href="#/find-matches">Find My Matches</a>
        <a href="#/saved">Saved</a>
        <a href="#/about">About</a>
      </nav>
      <p class="footer-copy">Application always happens on each company&rsquo;s official source — Internix does not process applications.</p>
    </div>
  </footer>

  <!-- ============================== MODAL ============================== -->
  <div class="modal-overlay" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-x" id="modalClose" aria-label="Close dialog">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toastHolder"></div>

  <script src="/app.js"></script>
</body>
</html>
