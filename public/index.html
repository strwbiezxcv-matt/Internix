<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Internix — find internship and OJT opportunities matched to your academic program and preferred location across Bulacan and Metro Manila." />
  <title>Internix — Student Internship &amp; OJT Opportunity Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/branding.png" />
  <script>
    // Prevent flash of wrong theme on page load
    (function() {
      const saved = localStorage.getItem('internix.theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- ============================== HEADER ============================== -->
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="logo" href="#/" data-nav="home" aria-label="Internix home">
        <span class="mark" aria-hidden="true">
          <img src="/branding.png" width="32" height="32" alt="" />
        </span>
        <span class="logo-text">Internix</span>
      </a>
      <nav class="topnav main-nav" id="mainNav" aria-label="Main navigation"></nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- Sun icon (default for light mode) -->
          <circle cx="12" cy="12" r="4" stroke="currentColor" fill="none"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <div class="spacer"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">☰</button>
    </div>
  </header>

  <!-- ============================== MAIN ============================== -->
  <main id="app"></main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="mark sm" aria-hidden="true">
          <img src="/branding.png" width="24" height="24" alt="" />
        </span>
        <strong>Internix</strong>
      </div>
      <p class="footer-note">Internship discovery &amp; company directory for students — matched by program and location across Bulacan and Metro Manila.</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="#/companies">Companies</a>
        <a href="#/find-matches">Find My Matches</a>
        <a href="#/saved">Saved</a>
        <a href="#/about">About</a>
      </nav>
      <p class="footer-copy">Application always happens on each company&rsquo;s official source — Internix does not process applications.</p>
    </div>
  </footer>

  <!-- ============================== MODAL ============================== -->
  <div class="modal-overlay" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-x" id="modalClose" aria-label="Close dialog">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toastHolder"></div>

  <script src="/app.js"></script>
</body>
</html>
