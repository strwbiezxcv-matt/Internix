<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internix — Student Internship &amp; OJT Opportunity Finder</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232e9e5b'/%3E%3Cpath d='M16 7l9 5-9 5-9-5 9-5zm-6 9v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4l-6 3.3L10 16z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ============================== HEADER ============================== -->
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand" href="#" data-nav="home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22"><path d="M16 7l9 5-9 5-9-5 9-5zm-6 9v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4l-6 3.3L10 16z" fill="currentColor"/></svg>
        </span>
        Internix
      </a>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="topbar-user">
        <button class="nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================== MAIN ============================== -->
  <main id="app"></main>

  <!-- ============================== FOOTER ============================== -->
  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-brand">Internix</span>
      <span>Connecting students with internships, OJT &amp; entry-level opportunities.</span>
    </div>
  </footer>

  <!-- ============================== MODAL ============================== -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast-holder" id="toastHolder"></div>

  <script src="/app.js"></script>
</body>
</html>
